kind = "web"
previewPath = "/"
title = "BRX AI"
description = "A web companion for BRX AI with intelligent chat, persistent conversation history, and clear controls for managing the assistant experience."
version = "1.0.0"
id = "artifacts/brx-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22609

[services.development]
run = "pnpm --filter @workspace/brx-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brx-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/brx-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22609"
BASE_PATH = "/"
